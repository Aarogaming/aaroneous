[package]
name = "afc"
version = "0.1.0"
edition = "2021"
authors = ["Aaron"]
description = "Aaroneous Autonomous Flight Controller - Out-of-tree Sovereign CI/CD Hypervisor"

[[bin]]
name = "afc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
regex = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.34"
reqwest = { version = "0.12", features = ["json"], default-features = false }

[workspace]

