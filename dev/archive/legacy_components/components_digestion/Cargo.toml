[package]
name = "digestion"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
genetics = { path = "../../crates/genetics" }
anyhow = "1.0"
nervous_system = { path = "../../core/nervous_system" }
aaroneous_paths = { path = "../../crates/paths" }
