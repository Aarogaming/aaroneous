[package]
name = "nervous_system"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full", "tracing"] }
anyhow = "1.0"
memmap2 = "0.9"
rkyv = { version = "0.7", features = ["validation"] }
dirs = "5.0"
tracing = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
