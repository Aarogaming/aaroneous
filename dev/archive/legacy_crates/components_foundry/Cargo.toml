[package]
name = "foundry"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"

[lib]
name = "foundry"
path = "src/lib.rs"

[[bin]]
name = "foundry"
path = "src/main.rs"
