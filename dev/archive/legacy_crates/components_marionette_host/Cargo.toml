[package]
name = "marionette_host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
image = "0.24"
enigo = "0.2"
scrap = "0.5"

[lib]
name = "marionette_host"
path = "src/lib.rs"

[[bin]]
name = "marionette_host"
path = "src/main.rs"
