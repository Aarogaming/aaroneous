# cargo-deny configuration for Aaroneous.
#
# Run locally with `cargo deny check`, or see
# .github/workflows/security-audit.yml for the CI job. Advisories are the
# hard gate (a known-vulnerable or yanked crate fails the build); license and
# duplicate-version checks start as warnings so they surface without
# blocking merges on day one — tighten `deny` -> once the workspace's
# existing duplicate-version debt (multiple `gemm`/`pulp`/`dyn-stack`
# versions pulled in transitively by candle) is cleaned up.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
