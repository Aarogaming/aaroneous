[workspace]
resolver = "2"

members = [
    "dev/emulator_harness",
    "dev/chaos_injector",
    "dev/rfc0006_poc/abi",
    "dev/rfc0006_poc/host",
    "crates/ipc_bus",
    "crates/capabilities",
    "crates/orchestrator",
    "crates/adaptation_plane",
    "crates/adaptation_engine",
    "crates/omni",
    "crates/transpiler",
    "crates/api",
    "crates/scratchpad",
    "crates/governance",
    "crates/compute",
    "crates/si_ir",
    "crates/si_format",
    "crates/platform_bridge",
    "crates/paths",
    "crates/wire",
    "core/hypervisor",
    "sdk/rust",
    "crates/core-contracts",
    "crates/ast_auditor",
    "crates/cratify",
    "crates/studio_hud",
    "crates/llm_gateway",
    "crates/llm_gateway_types",
    "crates/runtime_monitor",
    "crates/runtime_monitor/runtime_monitor_bench",
    "crates/mcp_server",
    "crates/orchestration_plane",
    "crates/compliance_auditor",
    "xtask",
    "benches",
]

exclude = [
    "firmware",
    "dev/rfc0006_poc/plugins",
    # Deliberately non-compiling sample source (has real syntax/type errors by
    # design - see its own src/lib.rs) that crates/orchestration_plane's
    # canary_runner/canary_run/batch_cratify examples feed to the auditor by
    # file path, not as a workspace crate.
    "dev/canary_legacy_fixture",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
authors = ["Aaron"]
description = "Sovereign machine-native synthetic intelligence runtime and desktop hypervisor"
license = "MIT"
repository = "https://github.com/aaroneous/aaroneous"
keywords = ["ai", "si", "synthetic-intelligence", "runtime", "agent"]
categories = ["development-tools", "asynchronous", "wasm"]
readme = "README.md"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
bytemuck = { version = "1.14", default-features = false, features = ["derive", "min_const_generics"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"            # Cross-crate inlining across si_ir, compute, and platform_bridge
codegen-units = 1      # Maximizes compiler optimization across the entire workspace
panic = "abort"        # Removes unwinding landing pads (makes Cranelift W^X memory leaner)
strip = true           # Strips debug symbols from the final standalone binary

