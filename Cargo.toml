[package]
name = "a_run"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Enable Iroh-based P2P networking for Omnipresent specialist
# Brings in heavy dependencies (QUIC, relay, DNS), so it's opt-in
p2p-iroh = ["dep:iroh", "dep:n0-future"]
# Enable BLE biometric polling for Symbiotic specialist
biometric-ble = ["dep:btleplug"]
# Enable OpenXR for Phygital specialist (requires OpenXR runtime installed)
ar-openxr = ["dep:openxr"]
# Convenience: enable all real integrations
real-integrations = ["p2p-iroh", "biometric-ble", "ar-openxr"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
crossterm = { version = "0.28", features = ["events"] }
libloading = "0.9.0"
log = "0.4"
nats = "0.26.0"
notify = "6.1"
parking_lot = "0.12"
ratatui = { version = "0.27", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
shared_memory = "0.12.4"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
tokio = { version = "1.52.1", features = ["rt", "time", "full", "sync", "tracing"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
validator = { version = "0.18", features = ["derive"] }
wasmtime = "44.0.0"
windows-service = "0.8.0"
bytes = "1.5"
bincode = "1.3"

# Phase 2: LLM Integration (GGUF-based with llama.cpp)
async-trait = "0.1"
governor = "0.10"
thiserror = "2.0"
moka = { version = "0.12", features = ["future"] }
regex = "1.10"
which = "5.0"
rand = "0.8"

# Phase 3: Real external SDK integrations (all optional behind feature flags)
# Iroh: P2P QUIC connections for Omnipresent multi-device sync
iroh = { version = "0.98", optional = true }
n0-future = { version = "0.3", optional = true }
# btleplug: Cross-platform BLE for Symbiotic biometric polling
btleplug = { version = "0.11", optional = true }
# openxr: AR/VR runtime bindings for Phygital spatial rendering
openxr = { version = "0.19", optional = true }
