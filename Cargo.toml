[workspace]
resolver = "2"

members = [
    "crates/ipc_bus",
    "crates/capabilities",
    "crates/orchestrator",
    "crates/autonomic_adaptation",
    "crates/adaptation_engine",
    "crates/omni",
    "crates/transpiler",
    "crates/governance",
    "crates/compute",
    "crates/si_ir",
    "crates/si_format",
    "crates/platform_bridge",
    "crates/paths",
    "core/hypervisor",
    "sdk/rust",
    "templates/universal_native",
]

exclude = [
    "MaelstromUI/src-tauri",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.75"
authors = ["Aaron"]
description = "Sovereign machine-native synthetic intelligence runtime and desktop hypervisor"
license = "MIT"
repository = "https://github.com/aaroneous/aaroneous"
keywords = ["ai", "si", "synthetic-intelligence", "runtime", "agent"]
categories = ["development-tools", "asynchronous", "wasm"]
readme = "README.md"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
regex = "1.0"
lazy_static = "1.4"
once_cell = "1.0"

[profile.release]
opt-level = 3
lto = "fat"            # Cross-crate inlining across si_ir, compute, and platform_bridge
codegen-units = 1      # Maximizes compiler optimization across the entire workspace
panic = "abort"        # Removes unwinding landing pads (makes Cranelift W^X memory leaner)
strip = true           # Strips debug symbols from the final standalone binary