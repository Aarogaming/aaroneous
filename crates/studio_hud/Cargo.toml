[package]
name = "studio_hud"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Aaroneous Pillar 5: Desktop Studio & Telemetry HUD native egui/wgpu presentation layer"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aaroneous"
path = "src/bin/aaroneous.rs"

[[bin]]
name = "aaroneous-setup"
path = "src/bin/installer_gui.rs"

[[bin]]
name = "aaroneous-uninstall"
path = "src/bin/uninstaller_gui.rs"

[dependencies]
dirs = "5.0"

# Workspace crates
api = { path = "../api" }
hypervisor = { path = "../../core/hypervisor" }
ipc_bus = { path = "../ipc_bus" }
core-contracts = { path = "../core-contracts" }
omni = { path = "../omni" }
compute = { path = "../compute" }
orchestrator = { path = "../orchestrator" }
adaptation_plane = { path = "../adaptation_plane" }
governance = { path = "../governance" }
platform_bridge = { path = "../platform_bridge", features = ["native-win32"] }
specialists = { package = "capabilities", path = "../capabilities" }
paths = { path = "../paths" }
wire = { path = "../wire" }
adaptation_engine = { path = "../adaptation_engine" }
transpiler = { path = "../transpiler" }
tokio-serial = "5.4"

# GUI and Graphics
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.34"
rfd = "0.15"
wgpu = "29.0"
cgmath = "0.18"
bytemuck = "1.14"

# Core Utilities & Concurrency
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
memmap2 = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
anyhow = "1.0"
smol_str = "0.3"
ron = "0.8"
notify = "6.1"
tokio = { version = "^1.40.0", features = ["rt", "time", "sync", "tracing"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
