[package]
name = "orchestrator"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Multi-agent federation, hive runtime, MDP task routing, and control plane"
license.workspace = true
repository.workspace = true

[dependencies]
ipc_bus = { path = "../ipc_bus" }
governance = { path = "../governance" }
compute = { path = "../compute" }
si_ir = { path = "../si_ir" }
paths = { path = "../paths" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { workspace = true }
strum = { version = "0.26", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
regex = "1.10"
anyhow = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
memmap2 = "0.9"
tracing = "0.1"
notify = "6.1"
llama-gguf = { version = "0.14", optional = true, default-features = false, features = ["cpu"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["llama-gguf"]
llama-gguf = ["dep:llama-gguf"]
