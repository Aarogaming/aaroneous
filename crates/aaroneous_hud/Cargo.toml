[package]
name = "aaroneous_hud"
version = "0.1.0"
edition = "2024"
authors = ["Aaron"]
description = "HUD/UI layer for Aaroneous, extracted from hypervisor core"
license = "MIT"

[dependencies]
hypervisor = { path = "../../core/hypervisor" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
# UI dependencies
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["default"] }
ratatui = { version = "0.30", features = ["serde"] }
rfd = "0.15"
