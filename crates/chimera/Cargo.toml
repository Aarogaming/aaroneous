[package]
name = "chimera"
version = "0.1.0"
edition = "2021"
authors = ["Aaroneous"]
description = "Universal software adaptation, binary deconstruction, AST mutation, and code repair engine"

[dependencies]
nervous_system = { path = "../nervous_system" }
aaroneous_paths = { path = "../paths" }
compute = { path = "../compute" }
biology = { path = "../biology" }
omni = { path = "../omni" }
candle-core = "0.8"
regex = "1.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
stdext = "0.3"
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
goblin = "0.8"
similar = { version = "2.4", features = ["inline"] }
notify = "6.1"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
