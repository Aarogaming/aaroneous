[package]
name = "transpiler"
version = "0.1.0"
edition = "2021"
authors = ["Aaron"]
description = "Synthetic Intelligence (SI) to Conventional AI Inter-Intelligence Translation and Model Conversion Bridge"

[dependencies]
compute = { path = "../compute" }
aaroneous_paths = { path = "../paths" }
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
regex = "1.10"
