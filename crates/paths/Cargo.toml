[package]
name = "paths"
version = "0.1.0"
edition.workspace = true
authors = ["Aaron"]
description = "Centralized workspace path discovery and directory resolution for Aaroneous"
license.workspace = true
repository.workspace = true

[package.metadata.cratify]
profile = "control"

[dependencies]
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
