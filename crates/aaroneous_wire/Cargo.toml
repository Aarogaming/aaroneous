[package]
name = "aaroneous_wire"
version = "0.1.0"
edition = "2021"
authors.workspace = true
description = "Universal #![no_std] compatible wire protocol, COBS framing, and telemetry serialization for MCUs, Android, and PC"
license.workspace = true
repository.workspace = true

[dependencies]
postcard = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
crc = "3.2"

[features]
default = ["std"]
std = ["serde/std", "postcard/use-std"]
alloc = ["postcard/alloc"]
