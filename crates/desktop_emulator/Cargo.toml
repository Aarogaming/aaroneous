[package]
name = "desktop_emulator"
version = "0.1.0"
edition = "2021"
authors = ["Aaron"]
description = "Universal frontend user emulation, visual perception, backend probing, and datalogging engine"
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
compute = { path = "../compute" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
], optional = true }

[features]
default = []
native-win32 = ["dep:windows"]
