[package]
name = "specialists"
version = "0.1.0"
edition = "2021"
authors = ["Aaron"]
description = "The Specialist Federation of 9 Sovereign Domain Specialists and their paired Relic Substrates"
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
desktop_emulator = { path = "../desktop_emulator" }
adaptation_engine = { path = "../adaptation_engine" }
omni = { path = "../omni" }
ipc_bus = { path = "../ipc_bus" }
compute = { path = "../compute" }
paths = { package = "aaroneous_paths", path = "../paths" }
autonomic_adaptation = { path = "../autonomic_adaptation" }
