[package]
name = "capabilities"
version = "0.1.0"
edition.workspace = true
authors = ["Aaron"]
description = "Universal Capability Toolset, MCP Service Tools, and Domain Execution Substrates"
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
platform_bridge = { path = "../platform_bridge" }
adaptation_engine = { path = "../adaptation_engine" }
omni = { path = "../omni" }
ipc_bus = { path = "../ipc_bus" }
compute = { path = "../compute" }
paths = { package = "paths", path = "../paths" }
adaptation_plane = { path = "../adaptation_plane" }
ast_auditor = { path = "../ast_auditor" }
sdk = { path = "../../sdk/rust" }
libloading = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
