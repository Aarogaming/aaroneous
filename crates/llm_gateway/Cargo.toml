[package]
name = "llm_gateway"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "Aaroneous: Decoupled LLM provider gateway, local discovery, prompt caching, and MCP translation bridge"
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "5.0"

# Workspace crates
ipc_bus = { path = "../ipc_bus" }
aaroneous_paths = { path = "../paths" }

# Core Utilities & Concurrency
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "^1.40.0", features = ["rt", "time", "sync", "tracing"] }
async-trait = "0.1"
parking_lot = "0.12"
which = "5.0"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
llama-gguf = { version = "0.14", optional = true, default-features = false, features = ["cpu"] }

[features]
default = []
llama-gguf = ["dep:llama-gguf"]
