[package]
name = "llm_gateway"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Aaroneous: Decoupled LLM provider gateway, local discovery, prompt caching, and MCP translation bridge"
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0"

# Workspace crates
ipc_bus = { path = "../ipc_bus" }
paths = { path = "../paths" }
transpiler = { path = "../transpiler" }
si_ir = { path = "../si_ir" }

# Core Utilities & Concurrency
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "^1.40.0", features = ["rt", "time", "sync", "tracing"] }
async-trait = "0.1"
parking_lot = "0.12"
which = "5.0"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
local_inference = { path = "../local_inference" }

[features]
default = []
# Explicit local-inference backend selection, forwarded to `local_inference`.
#
# None of these are part of `default` — that is the entire point. Building
# `llm_gateway` normally must not silently pick a backend (or silently pick
# none, which today is the same as silently getting a bare CPU path with no
# record anyone asked for it, since `llama-gguf`'s own `cpu` feature flag
# does not gate any code path). A caller MUST opt into exactly one of these,
# e.g. `cargo build -p llm_gateway --features gguf-cpu`. See
# `local_inference::ensure_backend_selected` for the runtime-enforced half of
# this policy, and the C68 native-boundary audit for why GPU backends each
# need their own explicit, reviewed selection rather than a silent default.
gguf-cpu = ["local_inference/cpu"]
gguf-cuda = ["local_inference/cuda"]
gguf-vulkan = ["local_inference/vulkan"]
gguf-metal = ["local_inference/metal"]
