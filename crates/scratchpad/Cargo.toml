[package]
name = "scratchpad"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[package.metadata.cratify]
profile = "presentation"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }
api = { path = "../api" }

serde = { version = "1.0", features = ["derive"] }
