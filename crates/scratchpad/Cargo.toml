[package]
name = "scratchpad"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11"] }
egui = "0.34"
api = { path = "../api" }

serde = { version = "1.0", features = ["derive"] }
