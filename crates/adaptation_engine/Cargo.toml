[package]
name = "adaptation_engine"
version = "0.1.0"
edition.workspace = true
authors = ["Aaron"]
description = "Universal software adaptation, binary deconstruction, AST mutation, and code repair engine"
license.workspace = true
repository.workspace = true

[dependencies]
ipc_bus = { path = "../ipc_bus" }
paths = { path = "../paths" }
compute = { path = "../compute" }
governance = { path = "../governance" }
si_ir = { path = "../si_ir" }
candle-core = "0.11"
regex = "1.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
goblin = "0.8"
similar = { version = "2.4", features = ["inline"] }
notify = "6.1"
rayon = "1.10"
bytemuck = { workspace = true }
cratify_core = { path = "../cratify_core" }
walkdir = "2.5"
toml_edit = "0.21"

[dev-dependencies]
tempfile = { workspace = true }
