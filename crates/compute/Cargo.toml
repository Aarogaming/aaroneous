[package]
name = "compute"
version = "0.1.0"
edition = "2021"
authors.workspace = true
description = "SSM engine, .si containers, CKA+InfoNCE distillation, Cranelift JIT, and SiForge builder"
license.workspace = true
repository.workspace = true

[dependencies]
si_format = { path = "../si_format" }
si_ir = { path = "../si_ir" }
aaroneous_paths = { path = "../paths" }
ipc_bus = { path = "../ipc_bus" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-traits = "0.2"
candle-core = "0.8"
candle-nn = "0.8"
tracing = "0.1"
rkyv = { version = "0.7", features = ["validation"] }
anyhow = "1.0"
burn-wgpu = "0.21.0"
memmap2 = "0.9"
rustfft = "6.2"
statrs = "0.17"
hnsw_rs = "0.3"
parking_lot = "0.12"

# Cranelift Native JIT compilation
cranelift = "0.116"
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
target-lexicon = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.8"

[features]
simd = []
wasm = []
