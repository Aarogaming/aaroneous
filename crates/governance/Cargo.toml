[package]
name = "governance"
version = "0.1.0"
edition.workspace = true
authors = ["Aaron"]
description = "Hardware thermal governor and compute token resource manager for Aaroneous"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = { workspace = true }
compute = { path = "../compute", optional = true }
si_ir = { path = "../si_ir" }
si_format = { path = "../si_format" }
z3 = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }

[features]
default = []
adaptive-governance = ["compute", "dep:rand"]
z3-prover = ["z3"]
