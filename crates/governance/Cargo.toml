[package]
name = "governance"
version = "0.1.0"
edition = "2021"
authors = ["Aaron"]
description = "Hardware thermal governor and compute token resource manager for Aaroneous"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
tracing = "0.1"
anyhow = "1.0"
rand = "0.8"
sysinfo = "0.30"
compute = { path = "../compute" }
si_ir = { path = "../si_ir" }
si_format = { path = "../si_format" }
z3 = { version = "0.12", optional = true }

[features]
default = []
z3-prover = ["dep:z3"]
