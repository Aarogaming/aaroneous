[package]
name = "platform_bridge"
version = "0.1.0"
edition.workspace = true
authors = ["Aaron"]
description = "Universal frontend user emulation, visual perception, backend probing, and datalogging engine"
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
rustfft = "6.2"
compute = { path = "../compute" }
wire = { path = "../wire" }
si_ir = { path = "../si_ir" }
ipc_bus = { path = "../ipc_bus" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Performance",
    "Win32_System_SystemInformation", 
    "Win32_System_ProcessStatus"
]}
tokio-serial = "5.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
], optional = true }

[features]
default = ["midi-osc", "ndi-broadcast", "hooking-injector"]
native-win32 = ["dep:windows"]
midi-osc = []
ndi-broadcast = []
hooking-injector = []
