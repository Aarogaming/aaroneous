[package]
name = "omni"
version = "0.1.0"
edition = "2021"
authors = ["Aaroneous"]
description = "Universal 3D Galaxy semantic data navigation, star-node clustering, and visual search engine"

[dependencies]
compute = { path = "../compute" }
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bevy_ecs = "0.15"
glam = { version = "0.29", features = ["serde"] }
