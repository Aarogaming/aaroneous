[package]
name = "hive_mind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Aaroneous hive mind and orchestration layer"
license.workspace = true
repository.workspace = true

[package.metadata.cratify]
profile = "control"

[dependencies]
hypervisor = { path = "../../core/hypervisor" }
orchestrator = { path = "../orchestrator" }
omni = { path = "../omni" }
llm_gateway = { path = "../llm_gateway" }
adaptation_plane = { path = "../adaptation_plane" }
capabilities = { path = "../capabilities" }
adaptation_engine = { path = "../adaptation_engine" }
transpiler = { path = "../transpiler" }
core-contracts = { path = "../core-contracts" }
compute = { path = "../compute" }
si_ir = { path = "../si_ir" }
si_format = { path = "../si_format" }
wire = { path = "../wire" }
ipc_bus = { path = "../ipc_bus" }
platform_bridge = { path = "../platform_bridge" }
paths = { path = "../paths" }

# Common externals
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }

parking_lot = "0.12"
crossbeam-channel = "0.5"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
rand = "0.8"
thiserror = "1.0"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bincode = "1.3"
sysinfo = "0.30"
axum = { version = "0.8", features = ["macros"] }
tar = "0.4"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
async-nats = "0.34"
async-stream = "0.3"
semver = "1.0"
sha2 = "0.11"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors"] }

futures-util = "0.3"
zstd = "0.13"


cratify_core = { path = "../cratify_core" }


rusqlite = "0.40.0"
memmap2 = "0.9"






governance = { path = "../governance", features = ["adaptive-governance"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[features]
default = []
fault_injector = []
knowledge_gap = []

[lints.rust]
# These optional hardware/provider adapters were inherited from the hypervisor
# and remain inert until their dependencies pass admission for this crate.
unexpected_cfgs = "allow"
