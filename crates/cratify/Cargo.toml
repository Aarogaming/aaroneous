[package]
name = "cratify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Universal Sovereign Cratification CLI & Orchestration Dispatcher"
license.workspace = true
repository.workspace = true

[package.metadata.cratify]
profile = "tooling"

[[bin]]
name = "cratify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
cratify_core = { path = "../cratify_core" }
transpiler = { path = "../transpiler" }
adaptation_engine = { path = "../adaptation_engine" }
paths = { path = "../paths" }
serde_json = "1.0"

[dev-dependencies]
tempfile = { workspace = true }
