<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Carbon -->
    <linearGradient id="computeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B23"/>
      <stop offset="50%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Synaptic Lattice Gradient: Electric Cyan to Rust Amber -->
    <linearGradient id="synapseCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#00A6FF"/>
      <stop offset="100%" stop-color="#7059FF"/>
    </linearGradient>

    <linearGradient id="synapseAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF9E44"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>

    <linearGradient id="corePlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE0B2"/>
      <stop offset="65%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- Lattice Glow Filter -->
    <filter id="latticeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#computeBg)" stroke="#262D3D" stroke-width="4"/>

  <!-- Subtle Blueprint Hex Grid Background Pattern -->
  <g opacity="0.15" stroke="#00F0FF" stroke-width="1.5" fill="none">
    <polygon points="256,60 360,120 360,240 256,300 152,240 152,120" />
    <polygon points="256,212 360,272 360,392 256,452 152,392 152,272" />
    <polygon points="152,136 256,196 256,316 152,376 48,316 48,196" />
    <polygon points="360,136 464,196 464,316 360,376 256,316 256,196" />
  </g>

  <!-- Outer Satellite Hex Nodes & Synaptic Bridges -->
  <!-- Top Node (Amber) -->
  <polygon points="256,66 286,83 286,118 256,135 226,118 226,83" fill="#141822" stroke="url(#synapseAmber)" stroke-width="3.5" filter="url(#latticeGlow)"/>
  <!-- Top Right Node -->
  <polygon points="390,143 420,160 420,195 390,212 360,195 360,160" fill="#141822" stroke="url(#synapseAmber)" stroke-width="3.5" filter="url(#latticeGlow)"/>
  <!-- Bottom Right Node -->
  <polygon points="390,300 420,317 420,352 390,369 360,352 360,317" fill="#141822" stroke="url(#synapseCyan)" stroke-width="3.5" filter="url(#latticeGlow)"/>
  <!-- Bottom Node (Cyan) -->
  <polygon points="256,377 286,394 286,429 256,446 226,429 226,394" fill="#141822" stroke="url(#synapseCyan)" stroke-width="3.5" filter="url(#latticeGlow)"/>
  <!-- Bottom Left Node -->
  <polygon points="122,300 152,317 152,352 122,369 92,352 92,317" fill="#141822" stroke="url(#synapseCyan)" stroke-width="3.5" filter="url(#latticeGlow)"/>
  <!-- Top Left Node -->
  <polygon points="122,143 152,160 152,195 122,212 92,195 92,160" fill="#141822" stroke="url(#synapseAmber)" stroke-width="3.5" filter="url(#latticeGlow)"/>

  <!-- Master Sacred Lattice Synapse Traces (Intersecting Geometric Vectors) -->
  <g filter="url(#latticeGlow)">
    <!-- Primary Equilateral Inversion Triangles -->
    <polygon points="256,100 405,358 107,358" fill="none" stroke="url(#synapseAmber)" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="256,412 107,154 405,154" fill="none" stroke="url(#synapseCyan)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Perimeter Circuit Links -->
    <line x1="256" y1="100" x2="390" y2="177" stroke="url(#synapseAmber)" stroke-width="3.5"/>
    <line x1="390" y1="177" x2="390" y2="335" stroke="url(#synapseAmber)" stroke-width="3.5"/>
    <line x1="390" y1="335" x2="256" y2="412" stroke="url(#synapseCyan)" stroke-width="3.5"/>
    <line x1="256" y1="412" x2="122" y2="335" stroke="url(#synapseCyan)" stroke-width="3.5"/>
    <line x1="122" y1="335" x2="122" y2="177" stroke="url(#synapseCyan)" stroke-width="3.5"/>
    <line x1="122" y1="177" x2="256" y2="100" stroke="url(#synapseAmber)" stroke-width="3.5"/>

    <!-- Inner Radial Convergence Lines -->
    <line x1="256" y1="100" x2="256" y2="210" stroke="url(#synapseAmber)" stroke-width="3"/>
    <line x1="390" y1="177" x2="295" y2="232" stroke="url(#synapseAmber)" stroke-width="3"/>
    <line x1="390" y1="335" x2="295" y2="280" stroke="url(#synapseCyan)" stroke-width="3"/>
    <line x1="256" y1="412" x2="256" y2="302" stroke="url(#synapseCyan)" stroke-width="3"/>
    <line x1="122" y1="335" x2="217" y2="280" stroke="url(#synapseCyan)" stroke-width="3"/>
    <line x1="122" y1="177" x2="217" y2="232" stroke="url(#synapseCyan)" stroke-width="3"/>
  </g>

  <!-- Synaptic Junction Pulses (Node Beads) -->
  <circle cx="256" cy="100" r="8" fill="#FFD166"/>
  <circle cx="390" cy="177" r="8" fill="#FFB370"/>
  <circle cx="390" cy="335" r="8" fill="#00E5FF"/>
  <circle cx="256" cy="412" r="8" fill="#00F0FF"/>
  <circle cx="122" cy="335" r="8" fill="#00E5FF"/>
  <circle cx="122" cy="177" r="8" fill="#FFB370"/>

  <!-- Intermediate Core Hexagon Lattice -->
  <polygon points="256,196 308,226 308,286 256,316 204,286 204,226" 
           fill="#11141C" stroke="url(#synapseAmber)" stroke-width="4"/>

  <!-- Pulsing Central Thermodynamic Energy Singularity -->
  <circle cx="256" cy="256" r="42" fill="none" stroke="url(#synapseCyan)" stroke-width="2.5" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="28" fill="url(#corePlasma)" filter="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>
</svg>
