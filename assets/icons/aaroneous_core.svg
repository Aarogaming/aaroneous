<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian / Carbon -->
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E26"/>
      <stop offset="50%" stop-color="#12151B"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- Rust Amber / Thermal Core Gradient -->
    <linearGradient id="rustThermal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB370"/>
      <stop offset="35%" stop-color="#F2755E"/>
      <stop offset="70%" stop-color="#D94E64"/>
      <stop offset="100%" stop-color="#9E2A2B"/>
    </linearGradient>

    <!-- Electric Cyan / Neon Bus Interconnect Gradient -->
    <linearGradient id="cyanBus" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A6FF"/>
      <stop offset="100%" stop-color="#7059FF"/>
    </linearGradient>

    <!-- Glow Filter for Central Singularity -->
    <filter id="coreAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#coreBg)" stroke="#282E3B" stroke-width="4"/>

  <!-- Outer Hexagonal Swarm Grid (Dotted / Dashed) -->
  <polygon points="256,64 416,156 416,340 256,432 96,340 96,156" 
           fill="none" stroke="#222834" stroke-width="8"/>
  <polygon points="256,64 416,156 416,340 256,432 96,340 96,156" 
           fill="none" stroke="url(#cyanBus)" stroke-width="4" stroke-dasharray="24 16" stroke-linecap="round"/>

  <!-- Bus Channels / Synapse Interconnects -->
  <line x1="256" y1="64" x2="256" y2="176" stroke="url(#cyanBus)" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="432" x2="256" y2="320" stroke="url(#cyanBus)" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="156" x2="192" y2="212" stroke="url(#cyanBus)" stroke-width="5" stroke-linecap="round"/>
  <line x1="416" y1="156" x2="320" y2="212" stroke="url(#cyanBus)" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="340" x2="192" y2="284" stroke="url(#cyanBus)" stroke-width="5" stroke-linecap="round"/>
  <line x1="416" y1="340" x2="320" y2="284" stroke="url(#cyanBus)" stroke-width="5" stroke-linecap="round"/>

  <!-- Outer Interconnect Satellite Nodes -->
  <circle cx="256" cy="64" r="10" fill="#00E5FF"/>
  <circle cx="416" cy="156" r="10" fill="#00A6FF"/>
  <circle cx="416" cy="340" r="10" fill="#7059FF"/>
  <circle cx="256" cy="432" r="10" fill="#00E5FF"/>
  <circle cx="96" cy="340" r="10" fill="#00A6FF"/>
  <circle cx="96" cy="156" r="10" fill="#7059FF"/>

  <!-- Primary Thermodynamic Core Facet (Hexagon) -->
  <polygon points="256,136 360,196 360,316 256,376 152,316 152,196" 
           fill="#14171E" stroke="url(#rustThermal)" stroke-width="10" filter="url(#coreAura)"/>

  <!-- Inner Vector Matrix Rings -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="#252C38" stroke-width="4"/>
  <circle cx="256" cy="256" r="82" fill="none" stroke="url(#cyanBus)" stroke-width="4" stroke-dasharray="50 30" stroke-linecap="round"/>

  <!-- Central Quantum Singularity -->
  <circle cx="256" cy="256" r="46" fill="url(#rustThermal)"/>
  <circle cx="256" cy="256" r="22" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="256" cy="256" r="8" fill="#FFE5D9"/>
</svg>
