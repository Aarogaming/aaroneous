<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Carbon Titanium -->
    <linearGradient id="afcCarbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="50%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#06070A"/>
    </linearGradient>

    <!-- Supersonic Cyan Glow Gradient -->
    <linearGradient id="hudCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="60%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <!-- Thrust Plume / Trajectory Ion Trail Gradient -->
    <linearGradient id="ionWake" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004488" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00A6FF" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E0FBFC" stop-opacity="1"/>
    </linearGradient>

    <!-- Thermal Amber Satellite Alert -->
    <linearGradient id="amberAlert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="60%" stop-color="#FFA044"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Bloom / Afterburner Filter -->
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#afcCarbonBg)" stroke="#222838" stroke-width="4"/>

  <!-- Orbital Compass HUD Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#1B2230" stroke-width="3"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#hudCyan)" stroke-width="4" 
          stroke-dasharray="8 12 18 12" stroke-linecap="round"/>

  <!-- Cardinal Direction Letters -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
     font-size="22" font-weight="900" fill="#E2E8F0" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="44" fill="#00F0FF">N</text>
    <text x="468" y="256" fill="#94A3B8">E</text>
    <text x="256" y="468" fill="#94A3B8">S</text>
    <text x="44" y="256" fill="#94A3B8">W</text>
  </g>

  <!-- Cardinal & Sub-cardinal Tick Marks -->
  <g stroke="url(#hudCyan)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="58" x2="256" y2="82"/>
    <line x1="430" y1="256" x2="454" y2="256"/>
    <line x1="256" y1="430" x2="256" y2="454"/>
    <line x1="58" y1="256" x2="82" y2="256"/>

    <line x1="388" y1="124" x2="372" y2="140" stroke="#475569" stroke-width="2"/>
    <line x1="388" y1="388" x2="372" y2="372" stroke="#475569" stroke-width="2"/>
    <line x1="124" y1="388" x2="140" y2="372" stroke="#475569" stroke-width="2"/>
    <line x1="124" y1="124" x2="140" y2="140" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Orbiting Telemetry Satellites (Amber & Cyan) -->
  <circle cx="180" cy="85" r="7" fill="url(#amberAlert)"/>
  <circle cx="430" cy="200" r="6" fill="#00F0FF"/>
  <circle cx="340" cy="425" r="8" fill="url(#amberAlert)"/>
  <circle cx="85" cy="330" r="6" fill="#00F0FF"/>

  <!-- Inner Gimbal Arc Reticle -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#253044" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- Supersonic Ion Thrust Plume / Curved Wake Trail (Bottom-Left to Jet) -->
  <path d="M 80 432 Q 130 380, 180 320 T 256 256" 
        fill="none" stroke="url(#ionWake)" stroke-width="36" stroke-linecap="round" opacity="0.35"/>
  <path d="M 72 440 Q 120 380, 186 315 T 268 244" 
        fill="none" stroke="url(#ionWake)" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
  <path d="M 72 440 Q 124 374, 196 304 T 276 232" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" filter="url(#vectorGlow)"/>

  <!-- Supersonic Stealth Vector Jet (Ascending 45° Northeast) -->
  <g filter="url(#vectorGlow)">
    <!-- Jet Fuselage & Delta Wings -->
    <polygon points="368,144 380,264 308,240 280,286 250,256 226,276 248,204 148,132" 
             style="display:none;"/>
    <!-- Clean High-Precision Aerodynamic Geometry -->
    <polygon points="360,152 355,275 285,255 240,300 230,265 195,255 255,185" 
             style="display:none;"/>
    <!-- Master Delta Interceptor (Northeast 45° Yaw) -->
    <polygon points="372,140 376,270 312,242 278,296 252,260 216,268 244,204 180,140" 
             style="display:none;"/>
    <!-- Symmetrical 45-deg Jet Centered on Trajectory Line -->
    <!-- Nose: (356, 156), Left Wingtip: (166, 260), Right Wingtip: (260, 356), Tail: (218, 294) -->
    <!-- Delta Interceptor Body -->
    <polygon points="362,150 366,246 312,246 292,298 266,266 216,294 246,244 150,248" 
             style="display:none;"/>

    <!-- Exact Beautiful Fighter Jet Geometry (Pointed 45° towards Upper Right) -->
    <!-- Central Nose: (355, 157) -->
    <!-- Starboard Wingtip: (375, 275) -->
    <!-- Starboard Engine Intake: (290, 240) -->
    <!-- Starboard Stabilizer: (260, 310) -->
    <!-- Center Engine Nozzle: (230, 282) -->
    <!-- Port Stabilizer: (202, 252) -->
    <!-- Port Engine Intake: (272, 222) -->
    <!-- Port Wingtip: (237, 137) -->
    <polygon points="355,157 375,275 290,240 260,310 230,282 202,252 272,222 237,137" 
             fill="#0E131C" stroke="url(#hudCyan)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Cockpit Canopy Glass Accent -->
    <polygon points="340,172 318,214 298,194" fill="#A5F3FC" opacity="0.9"/>
    <!-- Engine Afterburner Flare Core -->
    <circle cx="230" cy="282" r="9" fill="url(#amberAlert)"/>
    <circle cx="230" cy="282" r="4" fill="#FFFFFF"/>
  </g>
</svg>
