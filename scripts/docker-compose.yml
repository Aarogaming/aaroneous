# Aaroneous Docker Compose
#
# NOTE: Aaroneous uses SQLite for persistence (not PostgreSQL/Redis).
# This compose file provides a minimal setup with the Aaroneous binary.
# PostgreSQL, Redis, Jaeger, and ELK are NOT integrated into the codebase.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f aaroneous

services:
  aaroneous:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aaroneous
    environment:
      RUST_LOG: "a_run=info"
      AARONEOUS_WORKSPACE: "/app"
    ports:
      - "8001:8001"    # HTTP API
    volumes:
      - ./models:/app/models
      - ./config.toml:/app/config.toml:ro
      - aaroneous_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  aaroneous_data:
    driver: local
