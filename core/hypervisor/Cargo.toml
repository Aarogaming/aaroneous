[package]
name = "a_run"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "a_run"
path = "bin/a_run.rs"

[[bin]]
name = "spatial_kinetic"
path = "bin/spatial_kinetic.rs"

[[bin]]
name = "test_enigo"
path = "bin/test_enigo.rs"

[[bin]]
name = "genome_compiler"
path = "bin/genome_compiler.rs"

[[bin]]
name = "synapse_dump"
path = "bin/synapse_dump.rs"

[dependencies]
rustc-hash = "^2.1.0"
nervous_system = { path = "../nervous_system" }
sabs = { path = "../../components/sabs" }
skills = { path = "../../components/skills" }
genetics = { path = "../../components/genetics" }
digestion = { path = "../../components/digestion" }
biology = { path = "../../components/biology" }
agents = { path = "../../components/agents" }
constellation = { path = "../../components/constellation" }
control = { path = "../../components/control" }
hive = { path = "../../components/hive" }
compute = { path = "../../components/compute" }
intelligence = { path = "../../components/intelligence" }
scientific_analyzer = { path = "../../components/scientific_analyzer" }
aaroneous_paths = { path = "../../components/paths" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
dirs = "5.0"
crossbeam-channel = "0.5"
futures-core = "0.3"
futures-util = "0.3"
governor = "0.10"
hex = "0.4"
libloading = "0.9"
log = "0.4"
llama-gguf = { version = "0.14", optional = true, default-features = false, features = ["cpu"] }
notify = "6.1"
parking_lot = "0.12"
rand = "0.10"
rand_distr = "0.6"
ratatui = { version = "0.30", features = ["serde"] }
eframe = { version = "0.34", features = ["wgpu"] }
egui = "0.34"
ctrlc = "3.4"
memmap2 = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D12"] }
wgpu = "29.0"
bytemuck = "1.14"
cgmath = "0.18"
regex = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rdev = "0.5.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared_memory = "0.12.4"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
sysinfo = "0.39"
seahash = "4.1"
byteorder = "1.5"
tar = "0.4"
thiserror = "2.0"
chromiumoxide = "0.9.1"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
futures = "0.3"
futures-channel = "0.3"
tokio = { version = "^1.40.0", features = ["rt", "time", "full", "sync", "tracing"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde", "v7"] }
wasmtime = "45.0"
rocksdb = "0.21"
rkyv = { version = "0.8", features = ["bytecheck"] }
openraft = "0.9"
candle-core = "0.8"
candle-nn = "0.8"
windows-service = "0.8"
enigo = "0.2.1"
zstd = "0.13"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
which = "5.0"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
bytes = "1.5"
crossterm = "0.27"
semver = "1.0"
async-nats = "0.49"
url = "2.5"
wasmtime-wasi = "45.0"
cap-std = "3.4.5"


[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[features]
default = []
# Local LLM inference support via llama.cpp GGUF format
llama-gguf = ["dep:llama-gguf"]
# GPU utilization metrics via NVML (NVIDIA only)
gpu-metrics = []
# Persistent DNA bank storage backed by RocksDB
rocksdb-dna = []
# P2P mesh networking via Iroh (requires iroh + n0-future deps)
p2p-iroh = []
# Biometric sensor integration via btleplug (requires btleplug deps)
biometric-ble = []
# AR/VR spatial tracking via OpenXR (requires openxr deps)
ar-openxr = []
