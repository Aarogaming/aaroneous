[package]
name = "hypervisor"

version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Kernel mechanisms for execution, persistence, IPC, and hardware integration"
license.workspace = true
repository.workspace = true

[package.metadata.cratify]
profile = "kernel"

[lib]
path = "src/lib.rs"

















[[bench]]
name = "phase_x_smoke"
harness = false

[dependencies]
ipc_bus = { path = "../../crates/ipc_bus" }
core-contracts = { path = "../../crates/core-contracts" }
compute = { path = "../../crates/compute" }
platform_bridge = { path = "../../crates/platform_bridge", features = ["native-win32"] }
paths = { path = "../../crates/paths" }
wire = { path = "../../crates/wire" }
tokio-serial = "5.4"
si_ir = { path = "../../crates/si_ir" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
dirs = "5.0"
crossbeam-channel = "0.5"
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
llama-gguf = { version = "0.14", optional = true, default-features = false, features = ["cpu"] }
iroh = { version = "1.2", optional = true }
n0-future = { version = "0.3", optional = true }
nvml-wrapper = { version = "0.13", optional = true }
notify = "6.1"
parking_lot = "0.12"
rand = "0.10"
memmap2 = "0.9"
wgpu = "29.0"
bytemuck = "1.14"
regex = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
seahash = "4.1"
byteorder = "1.5"

thiserror = "2.0"
chromiumoxide = "0.9.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
futures = "0.3"
futures-channel = "0.3"
tokio = { version = "^1.40.0", features = ["rt", "time", "full", "sync", "tracing"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde", "v7"] }
bincode = "2.0"
rocksdb = "0.21"
rkyv = { version = "0.8", features = ["bytecheck"] }
smol_str = "0.3"
candle-core = "0.11"
candle-nn = "0.11"

async-trait = "0.1"
bytes = "1.5"
async-nats = "0.50"
url = "2.5"
tracing-appender = "0.2.5"

http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D12"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[build-dependencies]
anyhow = "1.0"

[features]
default = []
# Local LLM inference support via llama.cpp GGUF format
llama-gguf = ["dep:llama-gguf"]
# GPU telemetry via NVIDIA Management Library
gpu-metrics = ["dep:nvml-wrapper"]
# P2P mesh via Iroh QUIC transport / Fleet Federation
fleet = ["dep:iroh", "dep:n0-future"]
p2p-iroh = ["fleet"]
# Standalone mode: disables all external native build-time probes
standalone = []
simulation = []
testing = ["simulation"]


[lints.rust]
# Feature-gated modules reference future deps not yet added
unexpected_cfgs = "allow"

# Allow ambient_authority lint during security remediation phase
unknown_lints = "allow"
