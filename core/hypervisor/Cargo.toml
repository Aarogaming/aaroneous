[package]
name = "a_run"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
nervous_system = { path = "../nervous_system" }
sabs = { path = "../../components/sabs" }
skills = { path = "../../components/skills" }
genetics = { path = "../../components/genetics" }
digestion = { path = "../../components/digestion" }
biology = { path = "../../components/biology" }
agents = { path = "../../components/agents" }
constellation = { path = "../../components/constellation" }
control = { path = "../../components/control" }
hive = { path = "../../components/hive" }
compute = { path = "../../components/compute" }
intelligence = { path = "../../components/intelligence" }
scientific_analyzer = { path = "../../components/scientific_analyzer" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
crossbeam-channel = "0.5"
futures-core = "0.3"
futures-util = "0.3"
governor = "0.10"
libloading = "0.9"
log = "0.4"
llama-gguf = { version = "0.14", optional = true, default-features = false, features = ["cpu"] }
notify = "6.1"
nats = "0.26.0"
parking_lot = "0.12"
rand = "0.8"
ratatui = { version = "0.27", features = ["serde"] }
eframe = { version = "0.28", features = ["wgpu"] }
egui = "0.28"
wgpu = "0.20"
bytemuck = "1.14"
cgmath = "0.18"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rdev = "0.5.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared_memory = "0.12.4"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
sysinfo = "0.30"
tar = "0.4"
thiserror = "2.0"
chromiumoxide = { version = "0.7.0", features = ["async-runtime"] }
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
readability = "0.3.0"
futures = "0.3"
tokio = { version = "1.52.1", features = ["rt", "time", "full", "sync", "tracing"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde", "v7"] }
validator = { version = "0.18", features = ["derive"] }
wasmtime = "21.0.0"
wit-bindgen-rt = "0.24.0"
rocksdb = "0.21"
rkyv = { version = "0.7", features = ["validation"] }
sled = "0.34"
openraft = "0.9"
candle-core = "0.6"
candle-nn = "0.6"
windows-service = "0.8"
enigo = "0.2.1"
zstd = "0.13"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
which = "5.0"
memmap2 = "0.9"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
bincode = "1.3"
bytes = "1.5"
crossterm = "0.27"
semver = "1.0"
async-nats = "0.35"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
