[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
publish = false
description = "Performance benchmarks for Aaroneous core components"
license.workspace = true

[lib]
name = "benchmarks"
path = "src/lib.rs"

[[bench]]
name = "ssm_inference"
harness = false

[[bench]]
name = "adaptation_latency"
harness = false

[[bench]]
name = "mcp_tool_dispatch"
harness = false

[[bench]]
name = "si_mount"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
memmap2 = "0.9"
tempfile = "3.10"
compute = { path = "../crates/compute" }
