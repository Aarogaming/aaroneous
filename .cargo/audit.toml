# cargo-audit configuration. See .github/workflows/security-audit.yml.
#
# Every entry here is a *documented, evidence-backed* exception, not a
# blanket suppression — each was triaged via the reproducible dependency
# review built in aaroneous-devtools (contracts/dependency-review/v1/), not
# guessed. Re-run that tool after any dependency change and revisit this
# list; do not add an entry without the same kind of justification.

[advisories]
ignore = [
    # False positive: RUSTSEC advisories against the *unrelated* crates.io
    # package "scratchpad" (https://crates.io/crates/scratchpad), which this
    # workspace's crates/scratchpad path dependency happens to share a name
    # with. Confirmed via `cargo metadata` + the Cargo.lock `source` field
    # (a path dependency has no registry source) — see
    # contracts/dependency-review/v1/reports/aaroneous-41b6408.json in
    # aaroneous-devtools. There is nothing to update; renaming the local
    # crate is the only real remedy if this recurs.
    "RUSTSEC-2021-0030",
    "RUSTSEC-2025-0049",

    # rkyv 0.7.46 -> 0.8.17 is a major-version bump with a substantially
    # different derive/Archive API; this workspace derives Archive/
    # Deserialize/Serialize extensively (crates/ipc_bus and others). Not a
    # safe minimal patch — needs a dedicated migration, tracked separately
    # rather than bumped blindly under a CI-fix pass.
    "RUSTSEC-2026-0235",
]
