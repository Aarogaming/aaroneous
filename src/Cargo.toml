[package]
name = "a_run"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = []
gguf-inference = ["dep:llama-gguf"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
crossbeam-channel = "0.5"
futures-core = "0.3"
futures-util = "0.3"
governor = "0.10"
libloading = "0.9"
log = "0.4"
llama-gguf = { version = "0.14", optional = true, default-features = false, features = ["cpu"] }
notify = "6.1"
nats = "0.26.0"
parking_lot = "0.12"
rand = "0.8"
ratatui = { version = "0.27", features = ["serde"] }
eframe = "0.28"
egui = "0.28"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rdev = "0.5.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared_memory = "0.12.4"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
sysinfo = "0.30"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.52.1", features = ["rt", "time", "full", "sync", "tracing"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
validator = { version = "0.18", features = ["derive"] }
wasmtime = "44.0.0"
windows-service = "0.8"
enigo = "0.2.1"
zstd = "0.13"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
which = "5.0"
memmap2 = "0.9"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
bincode = "1.3"
bytes = "1.5"
crossterm = "0.27"
semver = "1.0"
async-nats = "0.35"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
