name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libudev-dev libasound2-dev libssl-dev pkg-config cmake

      - name: Windows native compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clangDir = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clangDir\libclang.dll")) { throw 'LLVM libclang is required' }
          "LIBCLANG_PATH=$clangDir" >> $env:GITHUB_ENV

      - name: Prefer the Visual Studio linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (!(Test-Path $linker)) { throw 'Visual Studio linker is required' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Text encoding contract
        run: python scripts/check_text_encoding.py

      - name: Formatting (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Canonical repository verification
        shell: bash
        run: bash scripts/agent_check.sh

      - name: Release binary check
        run: cargo check --release --bin aaroneous --bin hypervisor

      - name: Optional runtime features (compile only)
        run: cargo check -p hypervisor --all-targets --features llama-gguf,gpu-metrics,fleet,testing,standalone

      - name: Iroh compatibility feature (compile only)
        run: cargo check -p hypervisor --all-targets --features p2p-iroh
