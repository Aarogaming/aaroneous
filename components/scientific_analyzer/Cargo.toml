[package]
name = "scientific_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
compute = { path = "../compute" }
biology = { path = "../biology" }
constellation = { path = "../constellation" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
stdext = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
